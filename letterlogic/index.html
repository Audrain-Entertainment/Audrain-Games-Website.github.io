<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LetterLogic - A Strategic Word Puzzle</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 500px;
        }
        .game-wrapper {
            width: 100%;
            width: 100%; max-width: 405px;
            height: 740px; max-height: 85vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #7dd3fc;
            transform: scale(1.02);
        }
        p {
            color: #94a3b8;
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- THE ITCH.IO GAME EMBED -->
        <div class="game-wrapper">
            <!-- PASTE YOUR ITCH.IO IFRAME CODE HERE, REPLACING THIS TEMPLATE IFRAME -->
            <iframe frameborder="0" src="https://itch.io/embed-upload/19308471?color=121212" allowfullscreen="" width="405" height="740"><a href="https://audraingames.itch.io/letterlogic">Play LetterLogic on itch.io</a></iframe>
        </div>

        <!-- GOOGLE PLAY BUTTON -->
        <a href="/letterlogic/android" class="download-btn">
            Get it on Google Play
        </a>
        
        <p>LetterLogic is completely free and open-source.</p>
    </div>
</body>
</html>
